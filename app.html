  <title>遛呗 · 北京</title>
  <!-- Leaflet CSS & JS（免费开源地图，无需 API key）-->
  <link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
  <script src="https://cdn.bootcdn.net/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <style>
    :root {
      /* === 雾绿色系 · 低饱和 · 自然感 === */
      --mist:          #F7FAF8;
      --mist-deep:     #EEF3F0;
      --mist-card:     #FFFFFF;
      --fog-green:     #5B8A6E;
      --fog-light:     #7AA88E;
      --fog-dark:      #3D6B52;
      --fog-subtle:    #E8EEEA;

      /* 文字 */
      --tx-primary:    #1A2E24;
      --tx-secondary:  #4A6B5C;
      --tx-muted:      #8BA89D;
      --tx-faint:      #B0CCC0;

      /* 边框与阴影 */
      --bd:            rgba(91,138,110,0.13);
      --bd-hover:      rgba(91,138,110,0.25);
      --sh-sm:         0 1px 4px rgba(26,46,36,0.04);
      --sh-md:         0 2px 12px rgba(26,46,36,0.06);
      --sh-lg:         0 8px 30px rgba(26,46,36,0.08);

      /* 圆角 */
      --r-xs:          8px;
      --r-sm:          12px;
      --r-md:          16px;
      --r-lg:          20px;
      --r-xl:          24px;

      /* 功能色 */
      --c-free:        #4A7C5F;
      --c-paid:        #9A7840;
      --c-park-p:      #5B8A6E;
      --c-park-r:      #5B7A8A;
      --c-park-n:      #8A6B4A;
      --c-park-h:      #6B5B8A;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body {
      height: 100%;
      font-family: -apple-system, "PingFang SC", "SF Pro Display", sans-serif;
      background: var(--mist);
      color: var(--tx-primary);
      font-size: 15px;
      line-height: 1.45;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }
    #app {
      width: 100%; max-width: 430px; height: 100vh; margin: 0 auto;
      position: relative; overflow: hidden; background: var(--mist);
    }

    .page { position:absolute; inset:0; display:flex; flex-direction:column;
      transition: transform 0.35s cubic-bezier(.32,0,.2,1), opacity .28s ease; background:var(--mist); }
    .page.hidden { transform:translateX(100%); opacity:0; pointer-events:none; }
    .page.slide-left { transform:translateX(-30%); opacity:0; pointer-events:none; }
    .scrollable { overflow-y:auto; -webkit-overflow-scrolling:touch; flex:1; }

    /* 停车徽章 */
    .parking-badge { display:inline-flex; align-items:center; justify-content:center;
      width:26px;height:26px;border-radius:var(--r-xs);font-size:11px;font-weight:700;color:white;flex-shrink:0; }
    .badge-p{background:var(--c-park-p)} .badge-r{background:var(--c-park-r)}
    .badge-n{background:var(--c-park-n)} .badge-h{background:var(--c-park-h)}

    /* ========== 首页 Header（雾绿纯色） ========== */
    .home-header { background:var(--fog-green);
      padding:calc(env(safe-area-inset-top,18px)+10px) 20px 16px; }
    .header-top { display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; margin-top: 10px; padding: 0 16px;}
    .logo { display:flex; align-items:center; gap:10px; }
    .logo-icon { width:34px;height:34px;border-radius:50%;overflow:hidden;
      display:flex;align-items:center;justify-content:center;
      border:1.5px solid rgba(255,255,255,0.25); }
    .logo-icon img { width:100%;height:100%;object-fit:cover;border-radius:50%; }
    .logo-text { font-size:17px;font-weight:700;color:#FFF;letter-spacing:-0.2px; }
    .logo-sub { font-size:10.5px;color:rgba(255,255,255,0.65);margin-left:5px;margin-top:3px;letter-spacing:.5px; }
    .city-chip { display:flex;align-items:center;gap:5px;padding:5px 12px;
      background:rgba(255,255,255,0.15);border-radius:20px;font-size:12px;font-weight:500;
      color:rgba(255,255,255,0.9);cursor:pointer;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
      border:1px solid rgba(255,255,255,0.12);transition:background .2s; }
    .city-chip:active { background:rgba(255,255,255,0.25); }

    /* 搜索栏 */
    .search-bar { display:flex;align-items:center;gap:8px;
      background:rgba(255,255,255,0.92);border:none;border-radius:var(--r-md);padding:9px 14px;
      box-shadow:var(--sh-sm);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px); margin: 0 16px 10px 16px; }
    .search-bar input { flex:1;border:none;background:transparent;font-size:14px;color:var(--tx-primary);outline:none;letter-spacing:-0.1px; }
    .search-bar input::placeholder { color:var(--tx-muted); }

    /* 骰子 */
    .dice-btn { font-size:18px;cursor:pointer;flex-shrink:0;
      transition:transform .5s cubic-bezier(.4,0,.2,1);user-select:none;-webkit-tap-highlight-color:transparent;
      opacity:.75; animation:dice-idle 2.8s ease-in-out infinite; }
    .dice-btn:active { opacity:1; transform:scale(0.88); }
    .dice-btn.rolling { animation:dice-roll .7s ease-out; }
    @keyframes dice-idle { 0%,100%{transform:rotate(0deg)} 25%{transform:rotate(-10deg)} 75%{transform:rotate(10deg)} }
    @keyframes dice-roll {
      0%{transform:rotate(0deg) scale(1)} 20%{transform:rotate(120deg) scale(1.15)}
      40%{transform:rotate(240deg) scale(1.15)} 60%{transform:rotate(360deg) scale(1.1)}
      80%{transform:rotate(420deg) scale(1.05)} 100%{transform:rotate(360deg) scale(1)} }

    /* 骰子弹窗 */
    .dice-overlay { position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(26,46,36,0.5);z-index:99999;
      display:none;align-items:center;justify-content:center; }
    .dice-overlay.show { display:flex; }
    .dice-result { width:84%;max-width:340px;background:#FFFFFF;border-radius:24px;
      padding:26px 22px 22px;text-align:center;box-shadow:0 8px 30px rgba(0,0,0,0.2);
      border:1px solid rgba(91,138,110,0.13); }
    .dice-result-emoji { font-size:44px;margin-bottom:6px;display:block;animation:bounce-in .6s ease both; }
    .dice-result-title { font-size:20px;font-weight:700;color:var(--tx-primary);margin-bottom:3px;letter-spacing:-0.2px; }
    .dice-result-hint { font-size:12.5px;color:var(--tx-secondary);margin-bottom:14px;font-weight:400; }
    .dice-result-tags { display:flex;justify-content:center;gap:5px;flex-wrap:wrap;margin-bottom:14px;min-height:24px; }
    .dice-result-tag { display:inline-block;padding:3px 10px;border-radius:var(--r-sm);font-size:12px;font-weight:500;
      color:var(--tx-secondary);background:var(--mist-deep);border:1px solid var(--bd); }
    .dice-result-info { text-align:left;font-size:12.5px;color:var(--tx-secondary);line-height:1.7;margin-bottom:18px;
      padding:12px 14px;background:var(--mist);border-radius:var(--r-sm);border:1px solid var(--bd); }
    .dice-result-info div { margin-bottom:1px; }
    .dice-btn-row { display:flex;gap:8px; }
    .dice-btn-row button { flex:1;padding:10px 0;border-radius:var(--r-sm);font-size:13.5px;font-weight:600;cursor:pointer;border:none;transition:all .15s ease; }
    .dice-btn-go { background:var(--fog-green);color:white; }
    .dice-btn-go:active { background:var(--fog-dark);transform:scale(.97); }
    .dice-btn-again { background:var(--mist-deep);color:var(--tx-secondary); }
    .dice-btn-again:active { background:var(--fog-subtle);transform:scale(.97); }
    .dice-close-hint { font-size:11px;color:var(--tx-faint);margin-top:12px; }
    @keyframes bounce-in { 0%{transform:scale(0) rotate(-15deg);opacity:0} 60%{transform:scale(1.25) rotate(5deg);opacity:1} 100%{transform:scale(1) rotate(0);opacity:1} }

    /* 筛选栏（独立白底，轻量） */
    .filter-bar { background:var(--mist-card);padding:10px 16px 12px;
      overflow-x:auto;display:flex;gap:7px;-webkit-overflow-scrolling:touch;scrollbar-width:none;
      border-bottom:1px solid var(--bd); }
    .filter-bar::-webkit-scrollbar { display:none; }
    .filter-bar::after { content:"";padding-right:8px;flex-shrink:0; }
    .filter-tag { flex-shrink:0;padding:5px 13px;border-radius:18px;font-size:12.5px;font-weight:500;cursor:pointer;
      border:1px solid var(--bd);background:var(--mist-card);color:var(--tx-muted);transition:all .2s ease;user-select:none;letter-spacing:.2px; }
    .filter-tag.active { background:var(--fog-green);border-color:var(--fog-green);color:#FFF;box-shadow:var(--sh-sm); }
    .cat-tag { flex-shrink:0;padding:5px 12px;border-radius:18px;font-size:12.5px;font-weight:500;cursor:pointer;
      border:1px solid var(--bd);background:var(--mist-card);color:var(--tx-muted);transition:all .2s ease;user-select:none; }
    .cat-tag.active { background:var(--fog-green);border-color:var(--fog-green);color:#FFF;box-shadow:var(--sh-sm); }

    /* ========== 卡片 · Apple Maps 风格 ========== */
    .places-list { padding:16px 16px 16px;display:flex;flex-direction:column;gap:10px; }
    .place-card { background:var(--mist-card);border-radius:var(--r-md);padding:15px 16px;
      box-shadow:var(--sh-md);cursor:pointer;transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease;
      border:1px solid var(--bd);position:relative; }
    .place-card:active { transform:scale(.985);box-shadow:var(--sh-lg);border-color:var(--bd-hover); }
    .place-card-top { display:flex;justify-content:space-between;align-items:center;margin-bottom:6px; }
    .place-name-row { display:flex;align-items:center;gap:9px;flex:1;min-width:0; }
    .place-name { font-size:15.5px;font-weight:650;color:var(--tx-primary);letter-spacing:-0.15px;line-height:1.3; }
    .place-cost { font-size:11.5px;white-space:nowrap;font-weight:600;flex-shrink:0;
      padding:3px 9px;border-radius:var(--r-xs);border:1px solid var(--bd); }
    .place-address-row { font-size:12px;color:var(--tx-muted);margin-bottom:7px;
      display:flex;align-items:center;gap:5px;line-height:1.4; }
    .place-note { font-size:12px;color:var(--tx-secondary);margin-bottom:9px;line-height:1.55;
      padding:8px 10px;background:var(--mist);border-radius:var(--r-xs);
      box-sizing:border-box;display:-webkit-box;-webkit-box-orient:vertical;
      -webkit-line-clamp:3;overflow:hidden;max-height:74px;}
    .place-facilities { display:flex;flex-wrap:wrap;gap:5px;margin-bottom:9px; }
    .place-size { font-size:11.5px;color:var(--tx-muted);line-height:1.4;margin-bottom:8px;padding-left:1px;font-weight:450; }
    .place-cat-row { display:flex;align-items:center;gap:6px;margin-bottom:9px; }
    .cat-chip { font-size:11px;font-weight:600;padding:2px 9px;border-radius:10px;
      background:#E8F5E9;color:#2E7D32;white-space:nowrap;letter-spacing:.3px; }
    .cat-chip.cat-play { background:#FFF3E0;color:#E65100; }
    .cat-chip.cat-nature { background:#E3F2FD;color:#1565C0; }
    .cat-chip.cat-street { background:#F3E5F5;color:#7B1FA2; }
    .scene-badge { font-size:10px;font-weight:600;padding:1px 7px;border-radius:8px;
      background:#FFEBEE;color:#C62828;margin-left:auto; }

    /* 设施标签（统一低饱和雾绿调，不再彩虹色） */
    .facility-mini { font-size:11px;padding:3px 9px;border-radius:14px;font-weight:500;
      border:1px solid var(--bd);color:var(--tx-secondary);background:var(--mist);transition:transform .12s ease; }
    .facility-mini:hover { transform:scale(1.04); }
    .place-footer { display:flex;align-items:center;justify-content:space-between;
      padding-top:9px;border-top:1px solid var(--bd);margin-top:1px; }
    .parking-hint { display:flex;align-items:center;gap:5px;font-size:12px;color:var(--tx-secondary);font-weight:450; }
    .parking-hint.free { color:var(--c-free);font-weight:600; }
    .facility-count { font-size:11.5px;color:var(--tx-faint);font-weight:450;background:var(--mist);padding:3px 9px;border-radius:var(--r-xs); }
    .empty-state { text-align:center;padding:56px 20px;color:var(--tx-secondary); }
    .empty-state .emoji { font-size:44px;margin-bottom:12px;opacity:.6; }
    .empty-state p { font-size:15px;font-weight:500; }
    .retry-btn { display:inline-flex;align-items:center;gap:6px;margin-top:16px;
      padding:10px 24px;background:var(--fog-green);color:white;border:none;border-radius:var(--r-sm);
      font-size:14px;font-weight:600;cursor:pointer;-webkit-tap-highlight-color:transparent; }
    .retry-btn:active { opacity:.8; }
    .retry-hint { font-size:12px;color:var(--tx-faint);margin-top:8px; }

    /* 地图按钮 */
    .map-btn { font-size:22px;cursor:pointer;padding:6px 10px;border-radius:var(--r-sm);
      background:transparent;transition:all .15s ease;-webkit-tap-highlight-color:transparent;
      user-select:none;line-height:1.5;border:none; }
    .map-btn:active { transform:scale(0.92);opacity:.75; }
    .map-ping-icon { background:none;border:none;box-shadow:none; }

    /* 地图浮层 */
    .map-overlay { display:none;position:fixed;top:0;left:0;right:0;bottom:0;
      z-index:1000;background:#fff;flex-direction:flex-column;animation:mapFadeIn .25s ease; }
    .map-overlay.active { display:flex;flex-direction:column; }
    @keyframes mapFadeIn { from{opacity:0;} to{opacity:1;} }

    .map-header { display:flex;align-items:center;justify-content:space-between;
      padding:12px 16px;background:var(--fog-green);color:#fff;flex-shrink:0;
      box-shadow:0 2px 8px rgba(0,0,0,.1);z-index:10; }
    .map-header-title { font-size:16px;font-weight:700;display:flex;align-items:center;gap:6px; }
    .map-close-btn { font-size:22px;background:none;color:#fff;border:none;
      cursor:pointer;padding:4px 12px;-webkit-tap-highlight-color:transparent;
      border-radius:var(--r-xs);line-height:1.5; }
    .map-close-btn:active { background:rgba(255,255,255,.2); }

    .map-body { flex:1;display:flex;flex-direction:column;overflow:hidden;position:relative; }
    #leaflet-map { position:absolute;top:0;left:0;right:0;bottom:0;width:100%;height:100%;z-index:1; }

    /* 地图加载中 */
    .map-loading { position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:10;text-align:center;transition:opacity .25s ease; }
    .map-spinner { width:36px;height:36px;border:3.5px solid #E8F5E9;border-top-color:#07C160;border-radius:50%;animation:mapSpin .7s linear infinite;margin:0 auto 10px; }
    @keyframes mapSpin { to{ transform:rotate(360deg);} }
    .map-loading-text { font-size:13px;color:var(--tx-secondary);font-weight:500; }

    /* 公园点位列表 — 覆盖在地图上的底部面板 */
    .map-place-list { position:absolute;bottom:0;left:0;right:0;max-height:40vh;
      overflow-y:auto;background:rgba(255,255,255,.95);backdrop-filter:blur(8px);
      border-top:1px solid var(--bd);border-radius:16px 16px 0 0;
      padding:10px 12px 20px;z-index:5;box-shadow:0 -4px 20px rgba(0,0,0,.08);
      -webkit-overflow-scrolling:touch; }

    /* 分类图例 */
    .map-legend { position:absolute;top:12px;right:12px;z-index:600;
      background:rgba(255,255,255,.94);backdrop-filter:blur(12px);
      border-radius:14px;padding:10px 13px;box-shadow:0 2px 16px rgba(0,0,0,.1);
      border:1px solid rgba(0,0,0,.06);min-width:110px; }
    .map-legend-title { font-size:11.5px;font-weight:700;color:#333;margin-bottom:7px;letter-spacing:.5px; }
    .map-legend-item { display:flex;align-items:center;gap:8px;font-size:12px;color:#555;line-height:1.9;font-weight:500;cursor:pointer;transition:opacity .2s; }
    .map-legend-item:hover { opacity:.65; }
    .map-legend-dot { width:12px;height:12px;border-radius:50%;flex-shrink:0;border:1.5px solid #fff;box-shadow:0 0 0 .5px rgba(0,0,0,.15); }
    .map-place-item { display:flex;gap:12px;padding:13px 14px;margin-bottom:8px;
      background:#fff;border-radius:var(--r-sm);border:1px solid var(--bd);
      transition:transform .15s ease,box-shadow .15s ease;-webkit-tap-highlight-color:transparent;
      cursor:pointer; }
    .map-place-item:active { transform:scale(.98);box-shadow:0 2px 8px rgba(0,0,0,.06); }
    .map-place-rank { width:26px;height:26px;border-radius:50%;
      display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;
      color:#fff;flex-shrink:0; }
    .map-place-info { flex:1;min-width:0; }
    .map-place-name { font-size:15px;font-weight:650;color:var(--tx-primary);
      margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis; }
    .map-place-dist { font-size:12.5px;color:var(--c-free);font-weight:600; }
    .map-place-address { font-size:11.5px;color:var(--tx-muted);
      margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis; }
    .map-place-detail { display:none;padding:10px 14px 14px;margin-top:6px;
      background:var(--mist);border-radius:var(--r-xs);font-size:12px;
      color:var(--tx-secondary);line-height:1.55; }
    .map-place-detail.show { display:block; }
    .map-place-detail b { color:var(--tx-primary); }
    .loading-dots { display:inline-flex;gap:4px; }
    .loading-dots span { width:6px;height:6px;border-radius:50%;background:var(--fog-green);animation:dotBounce 1.2s infinite both; }
    .loading-dots span:nth-child(2){animation-delay:.15s}
    .loading-dots span:nth-child(3){animation-delay:.3s}
    @keyframes dotBounce { 0%,80%,100%{transform:scale(.6);opacity:.35} 40%{transform:scale(1);opacity:1} }
    .list-bottom-space { height:16px; }

    /* 懒加载哨兵 */
    .load-more-sentinel { text-align:center;padding:14px 0 24px;color:var(--tx-faint);font-size:13px;
      display:flex;align-items:center;justify-content:center;gap:8px;user-select:none; }
    .load-more-sentinel .spinner { width:18px;height:18px;border:2px solid var(--bd);border-top-color:var(--fog-green);border-radius:50%;animation:spin .7s linear infinite; }
    @keyframes spin { to{transform:rotate(360deg)} }
    .load-more-sentinel.done { color:var(--fog-light);font-weight:500; }

    /* ========== 详情页 ========== */
    .detail-header { background:var(--fog-green);
      padding: 10px 20px 16px;}
    .back-btn { display:flex;align-items:center;gap:6px;font-size:14.5px;font-weight:600;color:#FFF;cursor:pointer;width:fit-content; }
    .detail-nav-row { display:flex;align-items:center;justify-content:space-between;margin-bottom:10px; }
    .detail-edit-btn { display:inline-flex;align-items:center;gap:4px;font-size:12.5px;font-weight:600;color:#FFF;
      cursor:pointer;padding:5px 13px;border-radius:18px;background:rgba(255,255,255,0.18);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px); }
    .detail-name { font-size:21px;font-weight:700;color:#FFF;margin-bottom:6px;letter-spacing:-0.25px;line-height:1.25; }
    .detail-meta { display:flex;align-items:center;gap:10px;margin-bottom:6px;flex-wrap:wrap; }
    .detail-address { font-size:13px;color:rgba(255,255,255,0.88);display:flex;align-items:flex-start;gap:4px;line-height:1.5;
      cursor:pointer;padding:4px 0;border-radius:8px;transition:background .15s;-webkit-tap-highlight-color:transparent; }
    .detail-address:active { background:rgba(255,255,255,0.1); }
    .detail-address .nav-hint { font-size:11.5px;font-weight:600;color:#FFF;margin-left:auto;flex-shrink:0;white-space:nowrap;
      background:rgba(255,255,255,0.18);padding:4px 11px;border-radius:14px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);}
    .detail-body { padding:16px 16px;display:flex;flex-direction:column;gap:12px; }
    .detail-section { background:var(--mist-card);border-radius:var(--r-md);padding:16px;
      box-shadow:var(--sh-md);border:1px solid var(--bd); }
    .section-title { font-size:15px;font-weight:650;color:var(--tx-primary);margin-bottom:11px;letter-spacing:-0.15px; }
    .stars { color:#C4A86A;font-size:12.5px;letter-spacing:1px; }
    .facilities-grid { display:flex;flex-wrap:wrap;gap:7px; }

function loadPlaces() {
  /* 加时间戳防止缓存 */
  var ts = '?t=' + Date.now();
  return fetch('data.json' + ts)
    .then(function(r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    })
    .then(function(data) {
      if (!data || !data.length || data.length === 0) throw new Error('空数据');
      PLACES = data;
      _loadRetryCount = 0; /* 成功后重置 */
      renderHomeList(getFilteredPlaces());
    })
    .catch(function(err) {
      console.warn('[遛呗] 数据加载失败:', err.message || err);
      if (_loadRetryCount < _loadMaxRetries) {
        _loadRetryCount++;
        showLoadErrorState(true);
        var delay = _loadRetryDelays[Math.min(_loadRetryCount - 1, _loadRetryDelays.length - 1)];
        setTimeout(function() { loadPlaces(); }, delay);
      } else {
        /* 重试耗尽，尝试用内置兜底数据 */
        if (DEFAULT_PLACES && DEFAULT_PLACES.length > 0) {
          console.warn('[遛呗] 使用兜底数据（' + DEFAULT_PLACES.length + ' 条）');
          PLACES = DEFAULT_PLACES;
          renderHomeList(getFilteredPlaces());
        } else {
          /* 彻底没数据，显示手动刷新 */
          showLoadErrorState(false);
        }
      }
    });
}

function manualReload() {
  _loadRetryCount = 0; /* 重置计数，让用户可以无限点 */
  showLoadErrorState(true);
  loadPlaces();
}

/* ==========================================
   定位 & 距离计算
========================================= */
var userLocation = null;
var locationFailed = false;
/* 仅本地开发使用假定位 */
var _isLocal = (location.protocol === 'file:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1');
var FALLBACK_LOC = { lat: 39.908723, lng: 116.3975 }; /* 天安门 */
var _locAttempts = 0;
var _bestPos = null; /* 多次采样中精度最好的 */

function calcDistance(lat1, lng1, lat2, lng2) {
  var R = 6371;
  var dLat = (lat2 - lat1) * Math.PI / 180;
  var dLng = (lng2 - lng1) * Math.PI / 180;
  var a = Math.sin(dLat/2) * Math.sin(dLat/2) +
          Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
          Math.sin(dLng/2) * Math.sin(dLng/2);
  var c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
  return R * c;
}

function calcAllDistances(places) {
  if (!userLocation) {
    for (var i = 0; i < places.length; i++) places[i]._distance = null;
    return places;
  }
  for (var i = 0; i < places.length; i++) {
    if (places[i].lat && places[i].lng) {
      places[i]._distance = calcDistance(userLocation.lat, userLocation.lng, places[i].lat, places[i].lng);
    } else {
      places[i]._distance = null;
    }
  }
  places.sort(function(a, b) {
    if (a._distance === null) return 1;
    if (b._distance === null) return -1;
    return a._distance - b._distance;
  });
  return places;
}

function locateUser() {
  var locEl = document.getElementById('location-status');
  if (!locEl) return;
  locEl.innerHTML = '<span style="color:#FFF">📍 定位中...</span>';
  if (!navigator.geolocation) { locEl.innerHTML = '<span style="color:#FFE0E0">📍 不支持定位</span>'; if (_isLocal) { userLocation = FALLBACK_LOC; locationFailed = false; } return; }

  _locAttempts = 0;
  _bestPos = null;

  /* 连续采样最多3次，取精度最高的 */
  var maxSamples = 3;

  function tryLocate() {
    _locAttempts++;
    navigator.geolocation.getCurrentPosition(
      function(pos) {
        var acc = pos.coords.accuracy || 9999; /* 精度，单位米 */
        /* 记录最佳位置 */
        if (!_bestPos || acc < (_bestPos.accuracy || 9999)) {
          _bestPos = { lat: pos.coords.latitude, lng: pos.coords.longitude, accuracy: acc };
        }
        /* 如果精度已经很好（<50m）或已采够次数，直接用 */
        if (acc < 50 || _locAttempts >= maxSamples) {
          _useBestPosition(locEl);
          return;
        }
        /* 精度不够好，再试一次（间隔800ms避免过于频繁） */
        locEl.innerHTML = '<span style="color:#FFF">📍 精准定位中(' + _locAttempts + '/' + maxSamples + ')...</span>';
        setTimeout(tryLocate, 800);
      },
      function(err) {
        /* 只要拿到过一次结果就用，否则算失败 */
        if (_bestPos) { _useBestPosition(locEl); return; }
        var msg = '定位失败';
        locationFailed = true;
        if (err.code === 1) msg = '已拒绝定位';
        else if (err.code === 2) msg = '无法获取位置';
        else if (err.code === 3) msg = '定位超时';
        /* 仅本地开发时使用假定位 */
        if (_isLocal) { userLocation = FALLBACK_LOC; locationFailed = false; msg = '已定位（本地调试）'; }
        else { userLocation = null; }
        locEl.innerHTML = '<span style="color:#FFE0E0">📍 ' + msg + '</span>';
        renderHomeList(getFilteredPlaces());
        setTimeout(preloadMap, 1500);
      },
      /* 关键参数：不用缓存(maxAge=0)、高精度、12秒超时 */
      { enableHighAccuracy: true, timeout: 12000, maximumAge: 0 }
    );
  }

  function _useBestPosition(locEl) {
    if (!_bestPos) return;
    userLocation = { lat: _bestPos.lat, lng: _bestPos.lng };
    locationFailed = false;
    var accText = _bestPos.accuracy < 50 ? '✅' : (_bestPos.accuracy < 200 ? '⚠️' : '📍');
    locEl.innerHTML = '<span style="color:#FFFFFF">' + accText + ' 已定位(±' + Math.round(_bestPos.accuracy) + 'm)</span>';
    renderHomeList(getFilteredPlaces());
    setTimeout(preloadMap, 1500);
  }

  tryLocate();
}

var BATCH_SIZE = 8; /* 每批渲染 8 张卡片 */

function renderHomeList(places) {
  var c = document.getElementById("places-list");
  if (!places || !places.length) {
    c.innerHTML = '<div class="empty-state"><div class="emoji">🌿</div><p>没有找到包含该设施的地点</p><p style="margin-top:6px;font-size:13px;color:var(--tx-muted)">试试切换其他设施筛选</p></div>';
    hideLoadSentinel();
    return;
  }
  /* 保存完整列表供懒加载使用 */
  filteredForLazy = places;
  currentBatch = 0;
  /* 渲染第一批 */
  renderNextBatch();
}

function renderNextBatch() {
  var c = document.getElementById("places-list");
  var start = currentBatch * BATCH_SIZE;
  var end = Math.min(start + BATCH_SIZE, filteredForLazy.length);
  if (start === 0) c.innerHTML = ''; /* 首批清空 */

  var html = '';
  for (var i = start; i < end; i++) {
    var p = filteredForLazy[i];
    var fac = p.facilities.slice(0, 5);
    var free = hasFree(p);
    var costColor = p.cost === "免费" ? "var(--fog-dark)" : "#E67E00";
    var costBorder = p.cost === "免费" ? "rgba(56,142,60,0.4)" : "rgba(230,126,0,0.4)";
    html += '<div class="place-card" onclick="openDetail('+p.id+')">'
      + '<div class="place-card-top">'
      + '<div class="place-name-row">'
      + '<div class="place-name">'+p.name+'</div>'
      + '<div class="place-cost" style="color:'+costColor+';border:1.5px solid '+costBorder+'">'+p.cost+'</div>'
      + '</div></div>'
      + '<div class="place-address-row">📍 '+p.address+(!locationFailed ? ' &nbsp;|&nbsp; 🚶 '+(p._distance !== null ? p._distance.toFixed(1) : '?')+' km' : '')+'</div>'
      + (p.note ? '<div class="place-note">💬 '+p.note+'</div>' : '')
      + '<div class="place-facilities">';
    for (var j = 0; j < fac.length; j++) {
      if (VALID_FACILITIES.indexOf(fac[j]) !== -1) {
        var facClass = '';
        if (fac[j] === '沙坑') facClass = 'fac-sand';
        else if (fac[j] === '无动力') facClass = 'fac-play';
        else if (fac[j] === '戏水区') facClass = 'fac-water';
        else if (fac[j] === '大草坪') facClass = 'fac-lawn';
        else if (fac[j] === '骑行道') facClass = 'fac-bike';
        html += '<span class="facility-mini '+facClass+'">'+emoji(fac[j])+' '+displayName(fac[j])+'</span>';
      }
    }
    var validCount = fac.filter(function(f){ return VALID_FACILITIES.indexOf(f) !== -1; }).length;
    if (validCount > 5) {
      html += '<span class="facility-mini" style="color:var(--tx-muted)">+'+(validCount-5)+'</span>';
    }
    html += '</div>';
    if (p.size) {
      var sizeText = p.size;
      var sizeLabel = sizeText.split('·')[0];
      var sizeEmoji = sizeLabel.indexOf('超大')!==-1?'🏕️':sizeLabel.indexOf('大型')!==-1?'🌲':sizeLabel.indexOf('中型')!==-1?'🌳':'🌿';
      html += '<div class="place-size">'+sizeEmoji+' '+sizeText+'</div>';
    }
    /* 分类标签 + 室内外角标 */
    var cat = p.category || '户外公园';
    var catCls = 'cat-chip';
    if (cat === '游乐场') catCls += ' cat-play';
    else if (cat === '自然探索') catCls += ' cat-nature';
    else if (cat === '街心公园') catCls += ' cat-street';
    html += '<div class="place-cat-row">';
    html += '<span class="'+catCls+'">'+cat+'</span>';
    if (p.scene === '室内') html += '<span class="scene-badge">室内</span>';
    else html += '<span class="scene-badge" style="background:#E8F5E9;color:#2E7D32">室外</span>';
    html += '</div>';
    html += '<div class="place-footer">';
    html += '<div class="parking-hint'+(free?' free':'')+'">🚗 '+p.parking.length+' 个停车方案'+(free?'（含免费）':'')+'</div>';
    html += '<div class="facility-count">🎯 '+p.facilities.length+' 项设施</div>';
    html += '</div></div>';
  }
  c.innerHTML += html;

  currentBatch++;
  updateSentinel();
}

function getSentinel() {
  var s = document.getElementById('load-sentinel');
  if (!s) {
    s = document.createElement('div');
    s.id = 'load-sentinel';
    s.className = 'load-more-sentinel';
    var parent = document.getElementById("places-list").parentElement;
    if (parent && document.querySelector(".list-bottom-space")) {
      parent.insertBefore(s, document.querySelector(".list-bottom-space"));
    } else if (parent) {
      parent.appendChild(s);
    }
  }
  return s;
}

function updateSentinel() {
  var shown = Math.min(currentBatch * BATCH_SIZE, filteredForLazy.length);
  var total = filteredForLazy.length;
  var s = getSentinel();
  if (shown >= total) {
    s.className = 'load-more-sentinel done';
    s.innerHTML = '— 已展示全部 ' + total + ' 个 —';
  } else {
    s.className = 'load-more-sentinel';
    s.innerHTML = '<div class="spinner"></div>已加载 ' + shown + '/' + total + '，下滑加载更多...';
  }
}

/* 滚动监听：到底部自动加载下一批 */
(function() {
  var scrollContainer = null;
  var ticking = false;
  function checkScroll() {
    if (!scrollContainer) {
      var el = document.querySelector('#page-home .scrollable');
      if (el) scrollContainer = el; else return;
    }
    if (currentBatch * BATCH_SIZE >= filteredForLazy.length) return; /* 已全部加载 */
    var threshold = 120; /* 距底部 120px 时触发 */
    if (scrollContainer.scrollHeight - scrollContainer.scrollTop - scrollContainer.clientHeight < threshold) {
      renderNextBatch();
    }
    ticking = false;
  }
  /* 用事件委托监听首页滚动区 */
  document.addEventListener('scroll', function(e) {
    var target = e.target;
    if (target && target.classList && target.classList.contains('scrollable')) {
      if (!ticking) {
        requestAnimationFrame(checkScroll);
        ticking = true;
      }
    }
  }, true); /* capture 阶段捕获子元素滚动 */
})();

/* 筛选逻辑 */
function getFilteredPlaces() {
  var q = document.getElementById("search-input").value.trim().toLowerCase();
  var list = calcAllDistances(PLACES.slice(0));
  if (currentCategory !== "all") {
    list = list.filter(function(p){ return p.category === currentCategory; });
  }
  if (currentFilter !== "all") {
    list = list.filter(function(p){ return p.facilities.indexOf(currentFilter) !== -1; });
  }
  if (q) {
    list = list.filter(function(p){
      return p.name.toLowerCase().indexOf(q) !== -1
        || p.address.toLowerCase().indexOf(q) !== -1
        || p.facilities.some(function(f){ return f.toLowerCase().indexOf(q) !== -1; });
    });
  }
  return list;
}

function showPage(pageId, direction) {
  var pages = document.querySelectorAll(".page");
  var target = document.getElementById(pageId);
  for (var i = 0; i < pages.length; i++) {
    var pg = pages[i];
    if (direction === "forward") {
      if (!pg.classList.contains("hidden") && pg !== target) pg.classList.add("slide-left");
    } else {
      if (!pg.classList.contains("hidden") && pg !== target) pg.classList.add("hidden");
    }
  }
  target.classList.remove("hidden", "slide-left");
  setTimeout(function(){
    for (var i = 0; i < pages.length; i++) {
      var pg = pages[i];
      if (pg !== target) { pg.classList.add("hidden"); pg.classList.remove("slide-left"); }
    }
  }, 350);
}

/* ==========================================

========================================= */
(function() {
  var splash = document.getElementById("splash");
  var splashReady = false;
  var dataReady = false;
  var dismissed = false;

  function dismissSplash() {
    if (dismissed) return;
    if (splashReady && dataReady) {
      dismissed = true;
      if (splash) { splash.classList.add("hidden"); splash.style.display = "none"; }
    }
  }

  /* 1. 图片预加载完成后标记开屏就绪 */
  var img = new Image();
  img.onload = function() { setTimeout(function(){ splashReady = true; dismissSplash(); }, 300); };
  img.onerror = function() { splashReady = true; dismissSplash(); };
  img.src = 'tuotuo.jpg';

  /* 2. 首批数据渲染完成（8张卡片）后标记数据就绪 */
  var _origRenderHomeList = renderHomeList;
  renderHomeList = function(places) {
    _origRenderHomeList(places);
    requestAnimationFrame(function() {
      requestAnimationFrame(function() {
        dataReady = true;
        dismissSplash();
      });
    });
  };

  /* 3. 安全兜底：最晚 1.5 秒后强制消失（移动端网络可能慢） */
  setTimeout(function() { splashReady = true; dataReady = true; dismissSplash(); }, 1500);
})();

/* 收集表单数据 */
function collectFormData() {
  var name = document.getElementById("f-name").value.trim();
  var address = document.getElementById("f-address").value.trim();
  /* 距离由 GPS 自动计算，无需手动输入 */
  var cost = document.getElementById("f-cost").value.trim();
  var note = document.getElementById("f-note").value.trim();

  if (!name) { alert("请输入公园名称"); document.getElementById("f-name").focus(); return null; }
  if (!address) { alert("请输入地址"); document.getElementById("f-address").focus(); return null; }

  /* 收集设施 */
  var facs = [];
  var selFacs = document.querySelectorAll(".fac-check.selected");
  for (var i = 0; i < selFacs.length; i++) {
    facs.push(selFacs[i].getAttribute("data-fac"));
  }

  /* 收集停车场 */
  var pkItems = document.querySelectorAll("#pk-editor .pk-item");
  var parking = [];
  for (var i = 0; i < pkItems.length; i++) {
    var inputs = pkItems[i].querySelectorAll("input");
    var pkName = inputs[0].value.trim();
    var pkAddr = inputs[1].value.trim();
    var pkWalk = inputs[2].value.trim() || "2";
    var pkTip = inputs[3].value.trim();
    if (!pkName) continue;
    parking.push({
      type: "P",
      name: pkName,
      address: pkAddr,
      walk_min: parseInt(pkWalk, 10) || 2,
      peak_tip: pkTip
    });
  }

  return {
    id: editingId || (Date.now() % 100000),
    name: name,
    address: address,
    cost: cost || "免费",
    note: note || "",
    facilities: facs,
    parking: parking
  };
}

/* 保存 */
function saveForm() {
  var data = collectFormData();

  if (editingId !== null) {
    /* 更新已有记录 */
    for (var i = 0; i < PLACES.length; i++) {
      if (PLACES[i].id === editingId) { PLACES[i] = data; break; }

    PLACES.push(data);

  savePlaces(PLACES); /* 本地缓存 */
  showPage("page-home", "back");

}

/* 导航：调起手机地图 App */
function openNavigation(place) {
  var name = place.name;
  var lat = place.lat, lng = place.lng;

  /* iOS: iosamap://navi (官方文档，lon不是lng，dev=1=GCJ02坐标，poiname=目的地名) */
  var amapIos     = "iosamap://navi?sourceApplication=遛呗&poiname="+encodeURIComponent(name)+"&lat="+lat+"&lon="+lng+"&dev=1&style=2";

  /* Android: androidamap://route/plan (dname=目的地名) */
  var amapAndroid = "androidamap://route/plan/?dlat="+lat+"&dlon="+lng+"&dname="+encodeURIComponent(name)+"&dev=0&t=0";

  /* 腾讯地图 Universal Link（备选） */
  var tmap = "https://apis.map.qq.com/uri/v1/routeplan?type=drive&to="+encodeURIComponent(name)+"&tocoord="+lat+","+lng;

  var ua = navigator.userAgent || "";
  if (/iPad|iPhone|iPod/.test(ua)) {
    openWithFallback(amapIos, tmap);
  } else if (/Android/.test(ua)) {
    openWithFallback(amapAndroid, tmap);
  } else {
    window.open(tmap, "_blank");
  }
}

/* 尝试打开 URI Scheme，失败后自动 fallback 到 URL */
function openWithFallback(schemeUrl, fallbackUrl) {
  var start = Date.now();
  var timeout = setTimeout(function() {
    /* 如果 1.5s 后页面还在（说明 scheme 没有被处理），走 fallback */
    if (Date.now() - start < 2000) {
      window.location.href = fallbackUrl;
    }
  }, 1500);

  window.location.href = schemeUrl;

  /* 监听 page visibility：如果 App 成功调起，页面会隐藏，清除 fallback */
  document.addEventListener("visibilitychange", function fn() {
    if (document.hidden) { clearTimeout(timeout); document.removeEventListener("visibilitychange", fn); }
  });

  /* blur 也作为辅助判断 */
  window.addEventListener("blur", function fn() {
    clearTimeout(timeout); window.removeEventListener("blur", fn);
  });
}

function _initMap() {
  var mapEl = document.getElementById('leaflet-map');
  if (!mapEl || _mapInstance) return;

  _mapInstance = L.map('leaflet-map', {
    center: [userLocation.lat, userLocation.lng],
    zoom: 13,
    zoomControl: true
  });

  L.tileLayer('https://wprd0{s}.is.autonavi.com/appmaptile?lang=zh_cn&size=1&style=7&scl=1&x={x}&y={y}&z={z}', {
    attribution: '&copy; 高德地图',
    maxZoom: 18,
    subdomains: ['1','2','3','4']
  }).addTo(_mapInstance);

  var sorted = PLACES.slice().sort(function(a,b){ return (a._distance||999)-(b._distance||999); });
  var nearPlaces = sorted.filter(function(p){ return p._distance !== null && p._distance <= 15; });
  var topPlaces = nearPlaces.length > 0 ? nearPlaces : sorted.slice(0, 8);

  /* 分类颜色 */
  var CAT_COLORS = {
    '户外公园': '#07C160',
    '游乐场': '#FF7043',
    '自然探索': '#42A5F5',
    '街心公园': '#AB47BC'
  };
  function catColor(cat) { return CAT_COLORS[cat] || '#9BC5A0'; }

  L.circleMarker([userLocation.lat, userLocation.lng], {
    radius: 8, fillColor: '#2196F3', color: '#fff', weight: 2, fillOpacity: 0.9
  }).addTo(_mapInstance).bindPopup('<b>📍 你的位置</b>');

  for (var i = 0; i < topPlaces.length; i++) {
    var p = topPlaces[i];
    var d = p._distance !== null ? p._distance.toFixed(1) : '?';
    var facs = (p.facilities||[]).filter(function(f){return VALID_FACILITIES.indexOf(f)!==-1;}).slice(0,5);
    var catLabel = p.category || '户外公园';
    var pop = '<div style="min-width:180px;font-size:13px;line-height:1.5;">'
      + '<b style="font-size:14px;">'+p.name+'</b>'
      + '<br/><span style="color:'+catColor(catLabel)+';font-weight:600;">🚶 '+d+' km &nbsp;'+p.cost+'</span>'
      + '<br/>🏷️ '+catLabel
      + '<br/>📍 '+p.address;
    if (facs.length > 0) pop += '<br/><br/>🏸 '+facs.join('、');
    if (p.note) pop += '<br/><br/><span style="color:#666;font-size:12px;">'+p.note.substring(0,80)+(p.note.length>80?'...':'')+'</span>';
    pop += '</div>';
    L.circleMarker([p.lat, p.lng], {
      radius: 8, fillColor: catColor(catLabel), color: '#fff', weight: 1.75, fillOpacity: 0.88
    }).addTo(_mapInstance).bindPopup(pop);
  }

  var group = L.featureGroup(_mapInstance.getLayers());
  try { _mapInstance.fitBounds(group.getBounds().pad(0.25)); } catch(e){}

  var html = '';
  for (var j = 0; j < topPlaces.length; j++) {
    var pj = topPlaces[j], dj = pj._distance!==null ? pj._distance.toFixed(1) : '?';
    var rankBg = j<3 ? 'var(--fog-green)' : (j<6 ? '#60A55F' : '#9BC5A0');
    var catColorVal = catColor(pj.category || '户外公园');
    var fjcs = (pj.facilities||[]).filter(function(f){return VALID_FACILITIES.indexOf(f)!==-1;}).slice(0,4);
    var detailNote = pj.note ? ('<b>简介：</b>'+pj.note+'<br/><br/>') : '';
    var detailFac = fjcs.length > 0 ? ('<b>设施：</b>'+(pj.facilities||[]).filter(function(f){return VALID_FACILITIES.indexOf(f)!==-1;}).join('、')) : '';
    html += '<div class="map-place-item" onclick="toggleMapPlace(this);flyToPark('+pj.lat+','+pj.lng+')">'
      + '<div class="map-place-rank" style="background:'+rankBg+'">'+(j+1)+'</div>'
      + '<div class="map-place-info">'
      + '<div class="map-place-name"><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:'+catColorVal+';margin-right:6px;vertical-align:middle;"></span>'+pj.name+'</div>'
      + '<div class="map-place-dist">🚶 '+dj+' km &nbsp;&nbsp;'+pj.cost+'</div>'
      + '<div class="map-place-address">'+pj.address+'</div>'
      + '<div class="map-place-detail">'+detailNote+detailFac+'</div>'
      + '</div></div>';
  }
  document.getElementById('map-place-list').innerHTML = html;

  /* 分类图例 */
  var legendHtml = '<div class="map-legend"><div class="map-legend-title">🏷️ 公园分类</div>';
  var catOrder = ['户外公园','游乐场','自然探索','街心公园'];
  for (var ci = 0; ci < catOrder.length; ci++) {
    legendHtml += '<div class="map-legend-item"><span class="map-legend-dot" style="background:'+CAT_COLORS[catOrder[ci]]+'"></span>'+catOrder[ci]+'</div>';
  }
  legendHtml += '</div>';
  var mapBody = document.getElementById('map-body');
  if (!document.getElementById('map-legend-panel')) {
    var legEl = document.createElement('div');
    legEl.id = 'map-legend-panel';
    legEl.innerHTML = legendHtml;
    mapBody.appendChild(legEl);
  } else {
    document.getElementById('map-legend-panel').innerHTML = legendHtml;
  }

  /* 地图容器大小可能在隐藏时算错，打开时修正 */
  if (_mapPendingOpen) {
    _mapPendingOpen = false;
    setTimeout(function(){ _mapInstance.invalidateSize(); }, 100);
  }
}

function openMapLayer() {
  document.getElementById('map-overlay').classList.add('active');
  document.body.style.overflow = 'hidden';

  if (!userLocation) return;

  if (!_mapReady) {
    /* 地图还没预热，立即初始化 */
    _mapReady = true;
    _mapPendingOpen = true;
    _initMap();
  } else if (_mapInstance) {
    /* 已有实例，修正尺寸即可（因之前是隐藏状态） */
    setTimeout(function(){ _mapInstance.invalidateSize(); }, 80);
  }
}

function closeMapLayer() {
  document.getElementById('map-overlay').classList.remove('active');
  document.body.style.overflow = '';
  /* 不销毁实例，只是隐藏浮层 */
}

function renderMapContent() { /* 保留空函数，防止旧代码调用报错 */ }

function flyToPark(lat, lng) {
  if (!_mapInstance) return;
  _mapInstance.flyTo([lat, lng], 14, {duration: 0.6});
}

function toggleMapPlace(el) {
  var detail = el.querySelector('.map-place-detail');
  if (detail) detail.classList.toggle('show');
}
</script>
</body>
</html>
