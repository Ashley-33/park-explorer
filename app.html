<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#A5D6A7" />
  <title>遛呗 · 北京</title>
  <style>
    :root {
      --green-primary: #3D8B5F;
      --green-light:   #E6F2EB;
      --green-dark:    #1E6B42;
      --bg:            #F7FAF8;
      --white:         #FFFFFF;
      --orange:        #FF7043;
      --accent:        #FF9800;
      --text-primary:  #1A2E1A;
      --text-secondary:#5A7A60;
      --text-muted:    #8BA894;
      --border:        #DCE8DE;
      --shadow:        0 2px 12px rgba(0,0,0,0.06);
      --shadow-card:   0 4px 20px rgba(61,139,95,0.10);
      --radius-card:   16px;
      --radius-tag:    20px;
      --radius-btn:    12px;
      --park-p:        #3D8B5F;
      --park-r:        #4A8BBF;
      --park-n:        #FF7043;
      --park-h:        #9B6FCA;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body {
      height: 100%;
      font-family: -apple-system, 'PingFang SC', sans-serif;
      background: var(--bg);
      color: var(--text-primary);
      font-size: 15px;
      line-height: 1.5;
      overflow: hidden;
    }
    #app {
      width: 100%;
      max-width: 430px;
      height: 100vh;
      margin: 0 auto;
      position: relative;
      overflow: hidden;
      background: var(--bg);
    }

    /* ---- 页面容器 ---- */
    .page {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      transition: transform 0.32s cubic-bezier(0.4,0,0.2,1), opacity 0.32s ease;
      background: var(--bg);
    }
    .page.hidden { transform: translateX(100%); opacity: 0; pointer-events: none; }
    .page.slide-left { transform: translateX(-30%); opacity: 0; pointer-events: none; }

    /* ---- 滚动区 ---- */
    .scrollable { overflow-y: auto; -webkit-overflow-scrolling: touch; flex: 1; }

    /* ---- 停车类型徽章 ---- */
    .parking-badge {
      display: inline-flex; align-items: center; justify-content: center;
      width: 26px; height: 26px; border-radius: 8px;
      font-size: 11px; font-weight: 700; color: white; flex-shrink: 0;
    }
    .badge-p { background: var(--park-p); }
    .badge-r { background: var(--park-r); }
    .badge-n { background: var(--park-n); }
    .badge-h { background: var(--park-h); }

    /* ---- 首页 Header ---- */
    .home-header {
      background: var(--white);
      padding: 52px 20px 16px;
      border-bottom: 1px solid var(--border);
    }
    .header-top {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 14px;
    }
    .logo { display: flex; align-items: center; gap: 8px; }
    .logo-icon {
      width: 38px; height: 38px;
      border-radius: 50%; overflow: hidden;
      display: flex; align-items: center; justify-content: center;
      border: 2px solid var(--green-light);
      box-shadow: 0 2px 8px rgba(61,139,95,0.12);
    }
    .logo-icon img {
      width: 100%; height: 100%; object-fit: cover;
    }
    .logo-text { font-size: 18px; font-weight: 800; color: var(--green-dark); letter-spacing: -0.3px; }
    .logo-sub { font-size: 11px; color: var(--text-muted); margin-top: 1px; }
    .city-chip {
      display: flex; align-items: center; gap: 5px;
      padding: 6px 12px; background: var(--green-light);
      border-radius: 20px; font-size: 13px; font-weight: 600;
      color: var(--green-dark);
    }
    .search-bar {
      display: flex; align-items: center; gap: 10px;
      background: var(--bg); border: 1.5px solid var(--border);
      border-radius: var(--radius-btn); padding: 10px 14px;
    }
    .search-bar input {
      flex: 1; border: none; background: transparent;
      font-size: 14px; color: var(--text-primary); outline: none;
    }
    .search-bar input::placeholder { color: var(--text-muted); }

    /* ---- 筛选栏 ---- */
    .filter-bar {
      background: var(--white); padding: 12px 0 12px 20px;
      border-bottom: 1px solid var(--border);
      overflow-x: auto; display: flex; gap: 8px;
      -webkit-overflow-scrolling: touch; scrollbar-width: none;
    }
    .filter-bar::-webkit-scrollbar { display: none; }
    .filter-bar::after { content: ''; padding-right: 20px; flex-shrink: 0; }
    .filter-tag {
      flex-shrink: 0; padding: 6px 14px; border-radius: var(--radius-tag);
      font-size: 13px; font-weight: 500; cursor: pointer;
      border: 1.5px solid var(--border); background: var(--white);
      color: var(--text-secondary); transition: all 0.18s ease; user-select: none;
    }
    .filter-tag.active { background: var(--green-primary); border-color: var(--green-primary); color: var(--white); }

    /* ---- 地点卡片 ---- */
    .places-list { padding: 16px; display: flex; flex-direction: column; gap: 14px; }
    .place-card {
      background: var(--white); border-radius: var(--radius-card);
      padding: 18px; box-shadow: var(--shadow); cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      border: 1.5px solid transparent;
    }
    .place-card:active { transform: scale(0.985); box-shadow: var(--shadow-card); border-color: var(--green-light); }
    .place-card-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .place-name-row { display: flex; align-items: center; gap: 8px; flex: 1; min-width: 0; }
    .place-name { font-size: 17px; font-weight: 700; color: var(--text-primary); }
    .place-cost { font-size: 12px; white-space: nowrap; font-weight: 600; flex-shrink: 0; }
    .place-address-row { font-size: 12px; color: var(--text-secondary); margin-bottom: 8px; display: flex; align-items: center; gap: 6px; }
    .place-note { font-size: 12px; color: var(--text-muted); margin-bottom: 10px; line-height: 1.4; }
    .place-facilities { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
    .facility-mini {
      font-size: 12px; padding: 3px 9px;
      background: var(--green-light); color: var(--green-dark);
      border-radius: 10px; font-weight: 500;
    }
    .place-footer {
      display: flex; align-items: center; justify-content: space-between;
      padding-top: 10px; border-top: 1px solid var(--border);
    }
    .parking-hint { display: flex; align-items: center; gap: 5px; font-size: 12px; color: var(--text-secondary); }
    .parking-hint.free { color: var(--green-dark); font-weight: 500; }
    .facility-count { font-size: 12px; color: var(--text-muted); }
    .empty-state { text-align: center; padding: 60px 20px; color: var(--text-muted); }
    .empty-state .emoji { font-size: 48px; margin-bottom: 12px; }
    .empty-state p { font-size: 15px; }
    .list-bottom-space { height: 24px; }

    /* ---- 瀑布流懒加载 ---- */
    .load-more-sentinel {
      text-align: center; padding: 20px 0 30px;
      color: var(--text-muted); font-size: 13px;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      user-select: none;
    }
    .load-more-sentinel .spinner {
      width: 18px; height: 18px;
      border: 2.5px solid var(--border);
      border-top-color: var(--green-primary);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .load-more-sentinel.done { color: var(--green-dark); font-weight: 500; }

    /* ---- 详情页 ---- */
    .detail-header {
      background: var(--white); padding: 52px 20px 20px;
      border-bottom: 1px solid var(--border);
    }
    .back-btn {
      display: flex; align-items: center; gap: 6px;
      font-size: 15px; font-weight: 500; color: var(--green-primary);
      cursor: pointer; width: fit-content;
    }
    .detail-nav-row {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 14px;
    }
    .detail-edit-btn {
      display: inline-flex; align-items: center; gap: 4px;
      font-size: 14px; font-weight: 600; color: var(--green-primary);
      cursor: pointer; padding: 6px 14px; border-radius: 20px;
      background: var(--green-light);
    }
    .detail-name { font-size: 22px; font-weight: 800; color: var(--text-primary); margin-bottom: 6px; letter-spacing: -0.3px; }
    .detail-meta { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; }
    .detail-address { font-size: 13px; color: var(--text-secondary); display: flex; align-items: flex-start; gap: 4px; line-height: 1.4; }
    .detail-body { padding: 20px 16px; display: flex; flex-direction: column; gap: 20px; }
    .detail-section {
      background: var(--white); border-radius: var(--radius-card);
      padding: 18px; box-shadow: var(--shadow);
    }
    .section-title { font-size: 17px; font-weight: 700; color: var(--text-primary); margin-bottom: 12px; }
    .stars { color: #FFB300; font-size: 13px; letter-spacing: 1px; }
    .facilities-grid { display: flex; flex-wrap: wrap; gap: 8px; }
    .facility-tag {
      display: flex; align-items: center; gap: 5px;
      padding: 6px 12px; background: var(--green-light);
      color: var(--green-dark); border-radius: var(--radius-tag);
      font-size: 13px; font-weight: 500;
    }

    /* ---- 停车区块 ---- */
    .parking-tabs { display: flex; gap: 8px; margin-bottom: 14px; overflow-x: auto; scrollbar-width: none; }
    .parking-tabs::-webkit-scrollbar { display: none; }
    .parking-tab {
      display: flex; align-items: center; gap: 6px;
      padding: 7px 14px; border-radius: 10px;
      font-size: 13px; font-weight: 600; cursor: pointer;
      border: 2px solid var(--border); background: var(--white);
      color: var(--text-secondary); transition: all 0.18s ease;
      white-space: nowrap; flex-shrink: 0;
    }
    .parking-tab.active.tab-p { border-color: var(--park-p); background: #E8F5EE; color: var(--park-p); }
    .parking-tab.active.tab-r { border-color: var(--park-r); background: #EBF3FB; color: var(--park-r); }
    .parking-tab.active.tab-n { border-color: var(--park-n); background: #FFF4EB; color: var(--park-n); }
    .parking-tab.active.tab-h { border-color: var(--park-h); background: #F3EBFD; color: var(--park-h); }
    .parking-cards { display: flex; flex-direction: column; gap: 10px; }
    .parking-card {
      border: 1.5px solid var(--border); border-radius: 12px;
      padding: 14px; background: var(--bg);
    }
    .parking-card-top { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
    .parking-card-name { font-size: 15px; font-weight: 600; color: var(--text-primary); flex: 1; }
    .parking-tip {
      background: #FFFBF0; border: 1px solid #FFE9A0; border-radius: 8px;
      padding: 8px 10px; font-size: 12px; color: #7A5800;
      display: flex; align-items: flex-start; gap: 6px; line-height: 1.5;
    }

    /* ---- 管理入口按钮 ---- */
    .admin-btn {
      display: flex; align-items: center; justify-content: center;
      width: 36px; height: 36px; border-radius: 10px;
      background: var(--bg); border: 1.5px solid var(--border);
      font-size: 18px; cursor: pointer; transition: all 0.15s ease;
    }
    .admin-btn:active { background: var(--green-light); border-color: var(--green-primary); }

    /* ---- 密码弹窗 ---- */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.45); z-index: 999;
      display: flex; align-items: center; justify-content: center;
      opacity: 0; pointer-events: none; transition: opacity 0.25s ease;
    }
    .modal-overlay.show { opacity: 1; pointer-events: auto; }
    .modal-box {
      background: var(--white); border-radius: 20px; padding: 28px 24px 24px;
      width: 300px; text-align: center; box-shadow: 0 12px 40px rgba(0,0,0,0.2);
      transform: scale(0.9); transition: transform 0.25s ease;
    }
    .modal-overlay.show .modal-box { transform: scale(1); }
    .modal-title { font-size: 17px; font-weight: 700; color: var(--text-primary); margin-bottom: 6px; }
    .modal-sub { font-size:13px; color:var(--text-muted); margin-bottom:20px; }
    .pwd-input {
      width: 100%; height: 48px; border: 2px solid var(--border);
      border-radius: var(--radius-btn); text-align: center; font-size: 22px;
      letter-spacing: 8px; font-weight: 700; color: var(--text-primary);
      outline: none; -webkit-text-security: disc; margin-bottom: 16px;
    }
    .pwd-input:focus { border-color: var(--green-primary); }
    .pwd-error { font-size:12px; color:#E74C3C; margin-bottom:14px; min-height:18px; }
    .modal-btn-row { display: flex; gap: 10px; }
    .modal-btn {
      flex:1; height:42px; border-radius: var(--radius-btn); font-size:15px;
      font-weight:600; border:none; cursor: pointer; transition: all 0.15s ease;
    }
    .modal-btn-cancel { background:var(--bg); color:var(--text-secondary); border:1.5px solid var(--border); }
    .modal-btn-cancel:active { background:var(--border); }
    .modal-btn-ok { background:var(--green-primary); color:white; }
    .modal-btn-ok:active { background:var(--green-dark); }

    /* ---- 编辑表单页 ---- */
    .form-header {
      background: var(--white); padding: 52px 20px 16px;
      border-bottom: 1px solid var(--border);
    }
    .form-title { font-size:18px; font-weight:800; color:var(--green-dark); }
    .form-scrollable { overflow-y: auto; -webkit-overflow-scrolling: touch; flex:1; }
    .form-body { padding: 16px; display:flex; flex-direction:column; gap:14px; }
    .form-group { background:var(--white); border-radius:var(--radius-card); padding:16px; box-shadow:var(--shadow); }
    .form-label { font-size:13px; font-weight:600; color:var(--text-secondary); margin-bottom:8px; display:block; }
    .form-input, .form-textarea {
      width:100%; border:1.5px solid var(--border); border-radius:10px;
      padding:10px 12px; font-size:14px; color:var(--text-primary);
      outline: none; background:var(--bg); font-family:inherit;
    }
    .form-input:focus, .form-textarea:focus { border-color:var(--green-primary); background:var(--white); }
    .form-textarea { resize:vertical; min-height:60px; line-height:1.5; }
    .form-hint { font-size:11px; color:var(--text-muted); margin-top:4px; }
    /* 设施多选 */
    .fac-select { display:flex; flex-wrap:wrap; gap:8px; }
    .fac-check {
      padding:6px 12px; border-radius:var(--radius-tag); font-size:13px;
      border:1.5px solid var(--border); background:var(--white);
      color:var(--text-secondary); cursor:pointer; transition:all 0.15s ease;
      user-select: none;
    }
    .fac-check.selected { border-color:var(--green-primary); background:var(--green-light); color:var(--green-dark); font-weight:500; }
    .fac-check:active { transform:scale(0.95); }
    /* 停车场列表（编辑态） */
    .pk-editor { display:flex; flex-direction:column; gap:10px; }
    .pk-item { border:1.5px solid var(--border); border-radius:12px; padding:14px; background:var(--bg); }
    .pk-item-top { display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }
    .pk-item-name { font-size:14px; font-weight:600; color:var(--text-primary); flex:1; }
    .pk-del-btn {
      width:28px; height:28px; border-radius:50%; border:none; background:#FDECEA;
      color:#E74C3C; font-size:16px; cursor:pointer; display:flex; align-items:center; justify-content:center;
    }
    .pk-del-btn:active { background:#F5C6CB; }
    .pk-field { margin-bottom:8px; }
    .pk-field input, .pk-field select { width:100%; border:1.5px solid var(--border); border-radius:8px; padding:8px 10px; font-size:13px; color:var(--text-primary); outline:none; background:var(--white); }
    .pk-field input:focus, .pk-field select:focus { border-color:var(--green-primary); }
    .add-pk-btn {
      display:flex; align-items:center; justify-content:center; gap:6px;
      width:100%; height:40px; border:2px dashed var(--border); border-radius:12px;
      background:transparent; color:var(--text-muted); font-size:14px; font-weight:500;
      cursor:pointer; transition:all 0.15s ease;
    }
    .add-pk-btn:active { border-color:var(--green-primary); color:var(--green-primary); background:var(--green-light); }
    /* 底部操作栏 */
    .form-actions {
      display:flex; gap:10px; padding: 14px 16px 24px;
      background:linear-gradient(to top, var(--bg) 60%, transparent);
    }
    .form-actions button { flex:1; height:46px; border-radius:var(--radius-btn); font-size:16px; font-weight:700; border:none; cursor:pointer; }
    .btn-save { background:var(--green-primary); color:white; }
    .btn-save:active { background:var(--green-dark); }
    .btn-delete { background:#FDECEA; color:#E74C3C; }
    .btn-delete:active { background:#F5C6CB; }
    .btn-cancel-form { background:var(--bg); color:var(--text-secondary); border:1.5px solid var(--border); }
    .btn-cancel-form:active { background:var(--border); }

    /* ---- 启动画面 ---- */
    .splash-screen {
      position: fixed; inset: 0; z-index: 2000;
      display: flex; flex-direction: column;
      align-items: center; justify-content: flex-end;
      padding-bottom: 18vh;
      transition: opacity 0.7s ease, visibility 0.7s ease;
      overflow: hidden;
    }
    .splash-screen::before {
      content: '';
      position: absolute; inset: 0;
      background-image: url('tuotuo.jpg');
      background-size: cover;
      background-position: center 20%;
      filter: brightness(1.02);
    }
    .splash-screen::after {
      content: '';
      position: absolute; bottom: 0; left: 0; right: 0;
      height: 50%;
      background: linear-gradient(to top, rgba(46,125,50,0.75) 0%, rgba(46,125,50,0.25) 60%, transparent 100%);
      pointer-events: none;
    }
    .splash-screen.hidden {
      opacity: 0; visibility: hidden; pointer-events: none;
    }
    .splash-title {
      font-size: 44px; font-weight: 900; color: white;
      letter-spacing: 8px; margin-bottom: 10px;
      position: relative; z-index: 1;
      text-shadow: 0 3px 16px rgba(0,0,0,0.3);
      animation: splashFadeIn 0.8s ease both;
      animation-delay: 0.2s;
    }
    .splash-sub {
      font-size: 15px; color: rgba(255,255,255,0.88);
      letter-spacing: 3px;
      font-weight: 500;
      position: relative; z-index: 1;
      animation: splashFadeIn 0.8s ease both;
      animation-delay: 0.5s;
    }
    @keyframes splashFadeIn {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
<!-- 启动画面 -->
<div class="splash-screen" id="splash">
  <div class="splash-title">遛呗</div>
  <div class="splash-sub">今天去哪玩儿呢</div>
</div>

<div id="app">
  <!-- 首页 -->
  <div class="page" id="page-home">
    <div class="home-header">
      <div class="header-top">
        <div class="logo">
          <div class="logo-icon"><img src="tuotuo.jpg" alt="tuotuo" /></div>
          <div>
            <div class="logo-text">遛呗</div>
            <div class="logo-sub">今天去哪玩儿呢</div>
          </div>
        </div>
        <div class="city-chip" id="location-status" onclick="locateUser()" style="cursor:pointer" title="点击重新定位">📍 定位中...</div>
        <!-- 管理入口已移除 -->
      </div>
      <div class="search-bar">
        <span style="font-size:16px;color:var(--text-muted)">🔍</span>
        <input type="text" placeholder="搜索公园、设施..." id="search-input" />
      </div>
    </div>

    <!-- 设施筛选栏 -->
    <div class="filter-bar" id="filter-bar">
      <div class="filter-tag active" data-filter="all">全部</div>
      <div class="filter-tag" data-filter="沙坑">🏖️ 沙坑</div>
      <div class="filter-tag" data-filter="游乐设施">🛝 游乐设施</div>
      <div class="filter-tag" data-filter="戏水区">💧 戏水区</div>
      <div class="filter-tag" data-filter="大草坪">🌱 大草坪</div>
      <div class="filter-tag" data-filter="骑行道">🚲 骑行道</div>
      <div class="filter-tag" data-filter="树荫">🌳 树荫</div>
    </div>

    <!-- 地点列表 -->
    <div class="scrollable">
      <div class="places-list" id="places-list"></div>
      <div class="list-bottom-space"></div>
    </div>
  </div>

  <!-- 详情页 -->
  <div class="page hidden" id="page-detail">
    <div class="detail-header">
      <div class="detail-nav-row">
        <div class="back-btn" id="back-btn"><span style="font-size:18px">←</span> 返回</div>
        <div class="detail-edit-btn" id="detail-edit-btn" style="display:none" onclick="">✏️ 编辑</div>
      </div>
      <div class="detail-name" id="detail-name"></div>
      <div class="detail-meta" id="detail-meta"></div>
      <div class="detail-address" id="detail-address"></div>
    </div>
    <div class="scrollable">
      <div class="detail-body">
        <div class="detail-section">
          <div class="section-title">🎯 设施配置</div>
          <div class="facilities-grid" id="detail-facilities"></div>
        </div>
        <div class="detail-section">
          <div class="section-title">🚗 停车方案</div>
          <div class="parking-cards" id="parking-cards"></div>
        </div>
      </div>
      <div class="list-bottom-space"></div>
    </div>
  </div>

  <!-- 密码弹窗 -->
  <div class="modal-overlay" id="pwd-modal">
    <div class="modal-box">
      <div class="modal-title">🔐 管理员验证</div>
      <div class="modal-sub">请输入管理密码以继续</div>

<script>
/* ==========================================
   常量
========================================= */
var VALID_FACILITIES = ["沙坑","游乐设施","戏水区","大草坪","骑行道","树荫"];
var facilityEmoji = {"沙坑":"🏖️","游乐设施":"🛝","戏水区":"💧","大草坪":"🌱","骑行道":"🚲","树荫":"🌳","景观绿地":"🌿","野趣树林":"🌲","白沙滩":"🏖️","儿童游乐区":"🛝","小型沙坑":"🏖️","健身设施":"🏋️","休闲绿地":"🌿","梯田":"🌾","稻田":"🌾","观景台":"🔭","水系":"💧","栈道":"🪵","滨水景观":"🏞️","露营地":"⛺","平缓木栈道":"🪵","溪流":"💧","溯溪":"🌊","环山木栈道":"🥾","山林绿植":"🌲"};

/* ==========================================
   数据 & 持久化（纯静态方案：硬编码 + localStorage）
========================================= */
var DATA_VERSION = 4; /* v4=纯静态模式 */
var ADMIN_PASSWORD_LOCAL = "123123"; /* 前端密码验证（仅用于编辑门控，非安全用途） */

function loadPlaces() {
  try {
    var saved = localStorage.getItem("park_places");
    if (saved) return JSON.parse(saved);
  } catch(e) {}
  return null;
}
function savePlaces(data) {
  localStorage.setItem("park_places", JSON.stringify(data));
}

/* 数据加载（从 data.json 异步获取） */
var PLACES = [];

function loadPlaces() {
  return fetch('data.json')
    .then(function(r) { return r.json(); })
    .then(function(data) {
      PLACES = data;
      renderHomeList(getFilteredPlaces());
    })
    .catch(function() {
      /* data.json 加载失败时显示空状态提示 */
      document.getElementById('home-list').innerHTML =
        '<div style="text-align:center;padding:60px 20px;color:var(--text-muted);">数据加载失败，请检查网络连接</div>';
    });
}

/* 页面初始化：加载数据 */
loadPlaces();

/* ==========================================
   定位 & 距离计算
========================================= */
var userLocation = null;
var locationFailed = false; /* 定位是否失败（超时/拒绝/不支持）*/

function calcDistance(lat1, lng1, lat2, lng2) {
  var R = 6371;
  var dLat = (lat2 - lat1) * Math.PI / 180;
  var dLng = (lng2 - lng1) * Math.PI / 180;
  var a = Math.sin(dLat/2) * Math.sin(dLat/2) +
          Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
          Math.sin(dLng/2) * Math.sin(dLng/2);
  var c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
  return R * c;
}

function calcAllDistances(places) {
  if (!userLocation) {
    for (var i = 0; i < places.length; i++) places[i]._distance = null;
    return places;
  }
  for (var i = 0; i < places.length; i++) {
    if (places[i].lat && places[i].lng) {
      places[i]._distance = calcDistance(userLocation.lat, userLocation.lng, places[i].lat, places[i].lng);
    } else {
      places[i]._distance = null;
    }
  }
  places.sort(function(a, b) {
    if (a._distance === null) return 1;
    if (b._distance === null) return -1;
    return a._distance - b._distance;
  });
  return places;
}

function locateUser() {
  var locEl = document.getElementById('location-status');
  if (!locEl) return;
  locEl.innerHTML = '<span style="color:var(--orange)">📍 定位中...</span>';
  if (!navigator.geolocation) { locEl.innerHTML = '<span style="color:var(--park-n)">📍 不支持定位</span>'; locationFailed = true; return; }
  navigator.geolocation.getCurrentPosition(
    function(pos) {
      userLocation = { lat: pos.coords.latitude, lng: pos.coords.longitude };
      locationFailed = false;
      locEl.innerHTML = '<span style="color:var(--green-dark)">📍 已定位</span>';
      renderHomeList(getFilteredPlaces());
    },
    function(err) {
      var msg = '定位失败';
      locationFailed = true;
      if (err.code === 1) msg = '已拒绝定位';
      else if (err.code === 2) msg = '无法获取位置';
      else if (err.code === 3) msg = '定位超时';
      locEl.innerHTML = '<span style="color:var(--park-n)">📍 ' + msg + '</span>';
      renderHomeList(getFilteredPlaces());
    },
    { enableHighAccuracy: true, timeout: 8000, maximumAge: 300000 }
  );
}
setTimeout(function() { locateUser(); }, 2000);

/* 工具函数 */
function emoji(name) { return facilityEmoji[name] || "✅"; }
function stars(r) { var s = ""; for(var i=0;i<Math.floor(r);i++) s+="★"; if(r%1>=0.5) s+="½"; return s; }
function badgeClass(t) { return ({P:"badge-p",R:"badge-r",N:"badge-n",H:"badge-h"})[t]||"badge-p"; }
function tabClass(t)   { return ({P:"tab-p", R:"tab-r", N:"tab-n", H:"tab-h"})[t]||"tab-p"; }
function parkLabel(t) { return ({P:"🏛️ 园区",R:"🛣️ 路侧",N:"🏬 附近",H:"🔮 隐藏"})[t]||t; }
function hasFree(p)   { return false; }

/* 状态 */
var currentFilter = "all";
var currentParkingType = null;

/* ==========================================
   瀑布流懒加载
========================================= */
var BATCH_SIZE = 8; /* 每批渲染 8 张卡片 */
var currentBatch = 0;
var filteredForLazy = []; /* 当前筛选后的完整列表 */

function renderHomeList(places) {
  var c = document.getElementById("places-list");
  if (!places || !places.length) {
    c.innerHTML = '<div class="empty-state"><div class="emoji">🌿</div><p>没有找到包含该设施的地点</p><p style="margin-top:6px;font-size:13px;color:var(--text-muted)">试试切换其他设施筛选</p></div>';
    hideLoadSentinel();
    return;
  }
  /* 保存完整列表供懒加载使用 */
  filteredForLazy = places;
  currentBatch = 0;
  /* 渲染第一批 */
  renderNextBatch();
}

function renderNextBatch() {
  var c = document.getElementById("places-list");
  var start = currentBatch * BATCH_SIZE;
  var end = Math.min(start + BATCH_SIZE, filteredForLazy.length);
  if (start === 0) c.innerHTML = ''; /* 首批清空 */

  var html = '';
  for (var i = start; i < end; i++) {
    var p = filteredForLazy[i];
    var fac = p.facilities.slice(0, 5);
    var free = hasFree(p);
    var costColor = p.cost === "免费" ? "var(--green-dark)" : "#E67E00";
    html += '<div class="place-card" onclick="openDetail('+p.id+')">'
      + '<div class="place-card-top">'
      + '<div class="place-name-row">'
      + '<div class="place-name">'+p.name+'</div>'
      + '<div class="place-cost" style="color:'+costColor+'">'+p.cost+'</div>'
      + '</div></div>'
      + '<div class="place-address-row">📍 '+p.address+(!locationFailed ? ' &nbsp;|&nbsp; 🚶 '+(p._distance !== null ? p._distance.toFixed(1) : '?')+' km' : '')+'</div>'
      + (p.note ? '<div class="place-note">💬 '+p.note+'</div>' : '')
      + '<div class="place-facilities">';
    for (var j = 0; j < fac.length; j++) {
      html += '<span class="facility-mini">'+emoji(fac[j])+' '+fac[j]+'</span>';
    }
    if (p.facilities.length > 5) {
      html += '<span class="facility-mini" style="color:var(--text-muted)">+'+(p.facilities.length-5)+'</span>';
    }
    html += '</div><div class="place-footer">';
    html += '<div class="parking-hint'+(free?' free':'')+'">🚗 '+p.parking.length+' 个停车方案'+(free?'（含免费）':'')+'</div>';
    html += '<div class="facility-count">🎯 '+p.facilities.length+' 项设施</div>';
    html += '</div></div>';
  }
  c.innerHTML += html;

  currentBatch++;
  updateSentinel();
}

function getSentinel() {
  var s = document.getElementById('load-sentinel');
  if (!s) {
    s = document.createElement('div');
    s.id = 'load-sentinel';
    s.className = 'load-more-sentinel';
    var parent = document.getElementById("places-list").parentElement;
    if (parent && document.querySelector(".list-bottom-space")) {
      parent.insertBefore(s, document.querySelector(".list-bottom-space"));
    } else if (parent) {
      parent.appendChild(s);
    }
  }
  return s;
}

function updateSentinel() {
  var shown = Math.min(currentBatch * BATCH_SIZE, filteredForLazy.length);
  var total = filteredForLazy.length;
  var s = getSentinel();
  if (shown >= total) {
    s.className = 'load-more-sentinel done';
    s.innerHTML = '— 已展示全部 ' + total + ' 个 —';
  } else {
    s.className = 'load-more-sentinel';
    s.innerHTML = '<div class="spinner"></div>已加载 ' + shown + '/' + total + '，下滑加载更多...';
  }
}

function hideLoadSentinel() {
  var s = document.getElementById('load-sentinel');
  if (s) { s.style.display = 'none'; }
}
function showLoadSentinel() {
  var s = document.getElementById('load-sentinel');
  if (s) { s.style.display = ''; }
}

/* 滚动监听：到底部自动加载下一批 */
(function() {
  var scrollContainer = null;
  var ticking = false;
  function checkScroll() {
    if (!scrollContainer) {
      var el = document.querySelector('#page-home .scrollable');
      if (el) scrollContainer = el; else return;
    }
    if (currentBatch * BATCH_SIZE >= filteredForLazy.length) return; /* 已全部加载 */
    var threshold = 120; /* 距底部 120px 时触发 */
    if (scrollContainer.scrollHeight - scrollContainer.scrollTop - scrollContainer.clientHeight < threshold) {
      renderNextBatch();
    }
    ticking = false;
  }
  /* 用事件委托监听首页滚动区 */
  document.addEventListener('scroll', function(e) {
    var target = e.target;
    if (target && target.classList && target.classList.contains('scrollable')) {
      if (!ticking) {
        requestAnimationFrame(checkScroll);
        ticking = true;
      }
    }
  }, true); /* capture 阶段捕获子元素滚动 */
})();

/* 筛选逻辑 */
function getFilteredPlaces() {
  var q = document.getElementById("search-input").value.trim().toLowerCase();
  var list = calcAllDistances(PLACES.slice(0));
  if (currentFilter !== "all") {
    list = list.filter(function(p){ return p.facilities.indexOf(currentFilter) !== -1; });
  }
  if (q) {
    list = list.filter(function(p){
      return p.name.toLowerCase().indexOf(q) !== -1
        || p.address.toLowerCase().indexOf(q) !== -1
        || p.facilities.some(function(f){ return f.toLowerCase().indexOf(q) !== -1; });
    });
  }
  return list;
}

/* 筛选栏事件 */
document.getElementById("filter-bar").addEventListener("click", function(e) {
  var tag = e.target.closest(".filter-tag");
  if (!tag) return;
  var tags = document.querySelectorAll(".filter-tag");
  for (var i = 0; i < tags.length; i++) tags[i].classList.remove("active");
  tag.classList.add("active");
  currentFilter = tag.getAttribute("data-filter");
  renderHomeList(getFilteredPlaces());
});
document.getElementById("search-input").addEventListener("input", function() {
  renderHomeList(getFilteredPlaces());
});

/* 页面切换 */
function showPage(pageId, direction) {
  var pages = document.querySelectorAll(".page");
  var target = document.getElementById(pageId);
  for (var i = 0; i < pages.length; i++) {
    var pg = pages[i];
    if (direction === "forward") {
      if (!pg.classList.contains("hidden") && pg !== target) pg.classList.add("slide-left");
    } else {
      if (!pg.classList.contains("hidden") && pg !== target) pg.classList.add("hidden");
    }
  }
  target.classList.remove("hidden", "slide-left");
  setTimeout(function(){
    for (var i = 0; i < pages.length; i++) {
      var pg = pages[i];
      if (pg !== target) { pg.classList.add("hidden"); pg.classList.remove("slide-left"); }
    }
  }, 350);
}

function openDetail(id) {
  var place = null;
  for (var i = 0; i < PLACES.length; i++) {
    if (PLACES[i].id === id) { place = PLACES[i]; break; }
  }
  if (!place) return;
  renderDetail(place);
  showPage("page-detail", "forward");
}
document.getElementById("back-btn").addEventListener("click", function() {
  showPage("page-home", "back");
});

/* 详情页渲染 */
function renderDetail(p) {
  document.getElementById("detail-name").textContent = p.name;
  document.getElementById("detail-meta").innerHTML =
    '<span style="font-size:13px;font-weight:600;color:'+(p.cost==="免费"?"var(--green-dark)":"#E67E00")+'">'+(p.cost==="免费"?"🆓 免费":p.cost)+'</span>'
    + '<span style="color:var(--text-muted);font-size:13px">&nbsp;|&nbsp; 🚶 '+(p._distance !== null ? p._distance.toFixed(1) : '?')+' km</span>';
  document.getElementById("detail-address").innerHTML = "<span>📍</span><span>"+p.address+"</span>";
  /* 先清除上一次的 note 元素（如果有） */
  var oldNote = document.getElementById("detail-note");
  if (oldNote) oldNote.remove();
  if (p.note) {
    var noteEl = document.createElement("div");
    noteEl.id = "detail-note";
    noteEl.style.cssText = "font-size:13px;color:var(--text-muted);margin-top:6px;display:flex;align-items:flex-start;gap:4px;line-height:1.4";
    noteEl.innerHTML = "<span>💬</span><span>"+p.note+"</span>";
    document.getElementById("detail-address").insertAdjacentElement("afterend", noteEl);
  }

  // 设施
  var fhtml = "";
  for (var i = 0; i < p.facilities.length; i++) {
    fhtml += '<div class="facility-tag">'+emoji(p.facilities[i])+" "+p.facilities[i]+"</div>";
  }
  document.getElementById("detail-facilities").innerHTML = fhtml;

  // 停车：直接显示所有停车场（不再用 Tab 分类）
  renderAllParkingCards(p);
}

function renderParkingTabs(place, types) {
  /* 不再需要 Tab 分类，保留函数避免报错但留空 */
  document.getElementById("parking-tabs").innerHTML = "";
}

function renderAllParkingCards(place) {
  var h = "";
  for (var i = 0; i < place.parking.length; i++) {
    var pk = place.parking[i];
    h += '<div class="parking-card">'
      + '<div class="parking-card-top">'
      + '<div class="parking-badge '+badgeClass(pk.type)+'">'+pk.type+"</div>"
      + '<div class="parking-card-name">'+pk.name+'</div>'
      + '<div style="font-size:12px;color:var(--text-muted)">🚶 '+pk.walk_min+"分钟</div>"
      + "</div>"
      + '<div style="font-size:13px;color:var(--text-secondary);margin-bottom:10px;line-height:1.4">📍 '+pk.address+"</div>"
      + '<div class="parking-tip">💡 <span>'+pk.peak_tip+"</span></div>"
      + "</div>";
  }
  document.getElementById("parking-cards").innerHTML = h;
}

function selectParkingTab(type, placeId) { /* 不再使用 */ }

function renderParkingCards(place, type) {

  for (var i = 0; i < place.parking.length; i++) {

      + '<div class="parking-card-top">'
      + '<div class="parking-badge '+badgeClass(pk.type)+'">'+pk.type+"</div>"
      + '<div class="parking-card-name">'+pk.name+'</div>'
      + '<div style="font-size:12px;color:var(--text-muted)">🚶 '+pk.walk_min+"分钟</div>"
      + "</div>"
      + '<div style="font-size:13px;color:var(--text-secondary);margin-bottom:10px;line-height:1.4">📍 '+pk.address+"</div>"
      + '<div class="parking-tip">💡 <span>'+pk.peak_tip+"</span></div>"
      + "</div>";
  }
  document.getElementById("parking-cards").innerHTML = h;
}

/* ==========================================
   智能启动画面
========================================= */
(function() {
  var splash = document.getElementById("splash");
  var splashReady = false;
  var dataReady = false;
  var dismissed = false;

  function dismissSplash() {
    if (dismissed) return;
    if (splashReady && dataReady) {
      dismissed = true;
      if (splash) { splash.classList.add("hidden"); splash.style.display = "none"; }
    }
  }

  /* 1. 图片预加载完成后标记开屏就绪 */
  var img = new Image();
  img.onload = function() { setTimeout(function(){ splashReady = true; dismissSplash(); }, 300); };
  img.onerror = function() { splashReady = true; dismissSplash(); };
  img.src = 'tuotuo.jpg';

  /* 2. 首批数据渲染完成（8张卡片）后标记数据就绪 */
  var _origRenderHomeList = renderHomeList;
  renderHomeList = function(places) {
    _origRenderHomeList(places);
    requestAnimationFrame(function() {
      requestAnimationFrame(function() {
        dataReady = true;
        dismissSplash();
      });
    });
  };

  /* 3. 安全兜底：最晚 1.5 秒后强制消失（移动端网络可能慢） */
  setTimeout(function() { splashReady = true; dataReady = true; dismissSplash(); }, 1500);
})();

/* 初始渲染由 loadPlaces() 异步完成，无需同步调用 */

/* ==========================================
   密码门控
========================================= */
var isUnlocked = false; /* 全局解锁标记：false=只读模式 */
var pwdModal = document.getElementById("pwd-modal");
var pwdInput = document.getElementById("pwd-input");
var pwdError = document.getElementById("pwd-error");

function showPwdModal() {
  if (isUnlocked) { openForm(null); return; } /* 已解锁直接进表单 */
  pwdError.textContent = "";
  pwdInput.value = "";
  pwdModal.classList.add("show");
  setTimeout(function(){ pwdInput.focus(); }, 100);
}
function hidePwdModal() {
  pwdModal.classList.remove("show");
}
function checkPassword() {
  var v = pwdInput.value.trim();
  if (!v) { pwdError.textContent = "请输入密码"; return; }
  /* 纯前端密码验证（仅用于编辑门控） */
  if (v === ADMIN_PASSWORD_LOCAL) {
    hidePwdModal();
    isUnlocked = true;
    openForm(null); /* 新增模式 */
  } else {
    pwdError.textContent = "密码错误，请重试";
    pwdInput.value = "";
    setTimeout(function(){ pwdInput.focus(); }, 100);
  }
}
pwdInput.addEventListener("keydown", function(e) {
  if (e.keyCode === 13) { e.preventDefault(); checkPassword(); }
});

/* ==========================================
   编辑表单
========================================= */
var editingId = null; /* null=新增模式, 数字=编辑模式 */

document.getElementById("form-back-btn").addEventListener("click", cancelForm);

function openForm(placeId) {
  editingId = placeId;
  var titleText = document.getElementById("form-title-text");
  var delBtn = document.getElementById("btn-delete");

  /* 渲染设施多选 */
  var fsEl = document.getElementById("fac-select");
  var fh = "";
  for (var i = 0; i < VALID_FACILITIES.length; i++) {
    fh += '<div class="fac-check" data-fac="'+VALID_FACILITIES[i]+'" onclick="toggleFac(this)">'+emoji(VALID_FACILITIES[i])+' '+VALID_FACILITIES[i]+'</div>';
  }
  fsEl.innerHTML = fh;

  if (placeId === null) {
    /* 新增模式 */
    titleText.textContent = "添加公园";
    delBtn.style.display = "none";
    clearFormFields();
    addPkItem(); /* 默认一个空停车场行 */
  } else {
    /* 编辑模式 */
    titleText.textContent = "编辑公园";
    delBtn.style.display = "block";
    var p = null;
    for (var i = 0; i < PLACES.length; i++) {
      if (PLACES[i].id === placeId) { p = PLACES[i]; break; }
    }
    if (!p) return;
    fillFormFields(p);
  }

  showPage("page-form", "forward");
}

function clearFormFields() {
  document.getElementById("f-name").value = "";
  document.getElementById("f-address").value = "";
  /* 距离由 GPS 自动计算 */
  document.getElementById("f-cost").value = "";
  document.getElementById("f-note").value = "";
  /* 清除设施选中 */
  var checks = document.querySelectorAll(".fac-check.selected");
  for (var i = 0; i < checks.length; i++) checks[i].classList.remove("selected");
  /* 停车场：先清空再添加一行 */
  renderPkEditor([]);
  addPkItem();
}

function fillFormFields(p) {
  document.getElementById("f-name").value = p.name || "";
  document.getElementById("f-address").value = p.address || "";
  /* 距离由 GPS 自动计算 */
  document.getElementById("f-cost").value = p.cost || "";
  document.getElementById("f-note").value = p.note || "";
  /* 设施选中 */
  var checks = document.querySelectorAll(".fac-check");
  for (var i = 0; i < checks.length; i++) {
    var fn = checks[i].getAttribute("data-fac");
    if (p.facilities && p.facilities.indexOf(fn) !== -1) {
      checks[i].classList.add("selected");
    } else {
      checks[i].classList.remove("selected");
    }
  }
  /* 停车场 */
  renderPkEditor(p.parking || []);
}

/* 设施切换 */
function toggleFac(el) {
  el.classList.toggle("selected");
}

/* ---- 停车场编辑器 ---- */
function renderPkEditor(parkingList) {
  var container = document.getElementById("pk-editor");
  container.innerHTML = "";
  if (!parkingList || !parkingList.length) return;
  for (var i = 0; i < parkingList.length; i++) {
    appendPkRow(parkingList[i]);
  }
}
function appendPkRow(data) {
  data = data || { type:"P", name:"", address:"", walk_min:"2", peak_tip:"" };
  var container = document.getElementById("pk-editor");
  var idx = container.children.length;
  var row = document.createElement("div");
  row.className = "pk-item";
  row.setAttribute("data-pk-idx", idx);
  row.innerHTML =
    '<div class="pk-item-top">'
    + '<span class="pk-item-name">🅿️ 停车场 '+(idx+1)+'</span>'
    + '<button class="pk-del-btn" onclick="removePkItem(this)">×</button>'
    + '</div>'
    + '<div class="pk-field"><input placeholder="停车场名称" value="'+(data.name||'')+'" /></div>'
    + '<div class="pk-field"><input placeholder="地址" value="'+(data.address||'')+'" /></div>'
    + '<div style="display:flex;gap:8px">'
    + '<div class="pk-field" style="flex:1"><input type="number" placeholder="步行(分钟)" value="'+(data.walk_min||'')+'" /></div>'
    + '</div>'
    + '<div class="pk-field"><input placeholder="停车提示（高峰建议等）" value="'+(data.peak_tip||'')+'" /></div>';
  container.appendChild(row);
}
function addPkItem() {
  appendPkRow();
}
function removePkItem(btn) {
  var item = btn.closest(".pk-item");
  item.remove();
  /* 重新编号 */
  var items = document.querySelectorAll("#pk-editor .pk-item");
  for (var i = 0; i < items.length; i++) {
    items[i].querySelector(".pk-item-name").textContent = "🅿️ 停车场 "+(i+1);
  }
}

/* 收集表单数据 */
function collectFormData() {
  var name = document.getElementById("f-name").value.trim();
  var address = document.getElementById("f-address").value.trim();
  /* 距离由 GPS 自动计算，无需手动输入 */
  var cost = document.getElementById("f-cost").value.trim();
  var note = document.getElementById("f-note").value.trim();

  if (!name) { alert("请输入公园名称"); document.getElementById("f-name").focus(); return null; }
  if (!address) { alert("请输入地址"); document.getElementById("f-address").focus(); return null; }

  /* 收集设施 */
  var facs = [];
  var selFacs = document.querySelectorAll(".fac-check.selected");
  for (var i = 0; i < selFacs.length; i++) {
    facs.push(selFacs[i].getAttribute("data-fac"));
  }

  /* 收集停车场 */
  var pkItems = document.querySelectorAll("#pk-editor .pk-item");
  var parking = [];
  for (var i = 0; i < pkItems.length; i++) {
    var inputs = pkItems[i].querySelectorAll("input");
    var pkName = inputs[0].value.trim();
    var pkAddr = inputs[1].value.trim();
    var pkWalk = inputs[2].value.trim() || "2";
    var pkTip = inputs[3].value.trim();
    if (!pkName) continue;
    parking.push({
      type: "P",
      name: pkName,
      address: pkAddr,
      walk_min: parseInt(pkWalk, 10) || 2,
      peak_tip: pkTip
    });
  }

  return {
    id: editingId || (Date.now() % 100000),
    name: name,
    address: address,
    cost: cost || "免费",
    note: note || "",
    facilities: facs,
    parking: parking
  };
}

/* 保存 */
function saveForm() {
  var data = collectFormData();
  if (!data) return;

  if (editingId !== null) {
    /* 更新已有记录 */
    for (var i = 0; i < PLACES.length; i++) {
      if (PLACES[i].id === editingId) { PLACES[i] = data; break; }
    }
  } else {
    /* 新增 */
    PLACES.push(data);
  }

  savePlaces(PLACES); /* 本地缓存 */
  showPage("page-home", "back");
  renderHomeList(getFilteredPlaces());
}

/* 删除 */
function deletePlace() {
  if (!editingId) return;
  if (!confirm("确定要删除「"+getPlaceById(editingId).name+"」吗？此操作不可恢复。")) return;
  var newList = [];
  for (var i = 0; i < PLACES.length; i++) {
    if (PLACES[i].id !== editingId) newList.push(PLACES[i]);
  }
  PLACES = newList;
  savePlaces(PLACES); /* 本地缓存 */
  showPage("page-home", "back");
  renderHomeList(getFilteredPlaces());
}

/* 取消表单 */
function cancelForm() {
  showPage("page-home", "back");
}

function getPlaceById(id) {
  for (var i = 0; i < PLACES.length; i++) {
    if (PLACES[i].id === id) return PLACES[i];
  }
  return null;
}

/* 详情页编辑按钮（和返回按钮同一行，仅已解锁时显示） */
var _detailRenderOrig = renderDetail;
renderDetail = function(p) {
  _detailRenderOrig(p);
  var editBtn = document.getElementById("detail-edit-btn");
  if (isUnlocked) {
    editBtn.style.display = "inline-flex";
    editBtn.onclick = function() { openForm(p.id); };
  } else {
    editBtn.style.display = "none";
  }
};
</script>
</body>
</html>
